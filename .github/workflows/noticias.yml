name: Actualizar noticias

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Juntar titulares
        run: python3 noticias.py
        continue-on-error: true
      - name: Leer alertas del SMN
        run: python3 alertas.py
        continue-on-error: true
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add noticias.json alertas.json
          git diff --staged --quiet || (git commit -m "Actualizar noticias y alertas" && git push)
